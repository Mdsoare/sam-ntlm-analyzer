name: OWASP ZAP DAST Post-Deploy Scan

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  dast-zap:
    name: DAST (OWASP ZAP Baseline Scan)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@47214e21a224a1b02d847a974f26dbf5c0b115cb
        with:
          target: "https://mdsoare.github.io/sam-ntlm-analyzer/"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

      - name: Upload do Relatório HTML do DAST
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        if: always()
        with:
          name: zap-dast-html-report
          path: report_html.html
          retention-days: 14

name: OWASP ZAP DAST Post-Deploy Scan

on:
  workflow_run:
    workflows: ["pages-build-deployment"] # Nome exato da action nativa do GitHub Pages
    types:
      - completed

jobs:
  dast-zap:
    name: DAST (OWASP ZAP Baseline Scan)
    runs-on: ubuntu-latest
    # Executa apenas se o deploy do Pages tiver sido concluído com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://mdsoare.github.io/sam-ntlm-analyzer/"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

      - name: Upload do Relatório HTML do DAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-html-report
          path: report_html.html
          retention-days: 14

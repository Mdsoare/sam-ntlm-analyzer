name: OWASP ZAP & Nuclei DAST Scan

on:
  workflow_run:
    workflows: ["pages-build-deployment"] # Nome exato da action nativa do GitHub Pages
    types:
      - completed

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: DAST (OWASP ZAP Baseline Scan)
  # -------------------------------------------------------------
  dast-zap:
    name: DAST (OWASP ZAP Baseline Scan)
    runs-on: ubuntu-latest
    # Executa apenas se o deploy do Pages tiver sido concluído com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: "https://mdsoare.github.io/sam-ntlm-analyzer/"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

      - name: Upload do Relatório HTML do DAST
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zap-dast-html-report
          path: report_html.html
          retention-days: 14

  # -------------------------------------------------------------
  # JOB 2: DAST (Nuclei Scan)
  # -------------------------------------------------------------
  dast-nuclei:
    name: DAST (Nuclei Scan)
    runs-on: ubuntu-latest
    needs: dast-zap
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Executar Nuclei Scan
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538
        continue-on-error: true
        with:
          cache: false
          args: "-u https://mdsoare.github.io/sam-ntlm-analyzer/ -exclude-templates exposure/tokens/,http/exposures/ -et ssl,tls,dns,caa,waf -eid http-missing-security-headers,missing-sri,wildcard-tls,ssl-dns-names,ssl-issuer,caa-fingerprint,aaaa-fingerprint,waf-detect -sarif-export nuclei.sarif -silent -no-interactivity"

      - name: Tratar Arquivo SARIF Ausente ou Vazio
        if: always()
        run: |
          if [ ! -s "./nuclei.sarif" ]; then
            echo "⚠️ Arquivo SARIF do Nuclei não encontrado ou sem achados. Criando estrutura mínima válida..."
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemas/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Nuclei","informationUri":"https://nuclei.projectdiscovery.io"}},"results":[]}]}' > ./nuclei.sarif
          fi

      - name: Upload do Relatório Nuclei SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        if: always()
        with:
          sarif_file: nuclei.sarif
          category: Nuclei-DAST

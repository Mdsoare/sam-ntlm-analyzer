name: SAM & NTLM Forensic Analyzer CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancela execuções anteriores na mesma branch para otimizar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Análise Estática, Linters e Detecção de Segredos
  # -------------------------------------------------------------
  lint-and-security:
    name: SAST (Linting & Secret Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Auditoria de Segurança de Dependências (NPM Audit)
        run: npm audit --audit-level=high

      - name: Scan para detecção de segredos (Secret Detection)
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          extra_args: --only-verified

      - name: Validar Sintaxe HTML (HTMLHint)
        run: npx htmlhint index.html

      - name: Validar Estilos CSS (Stylelint)
        run: npx stylelint "assets/cs/*.css"

      - name: Análise Estática de Código JavaScript (ESLint)
        run: npx eslint assets/js/script.js

  # -------------------------------------------------------------
  # JOB 2: SAST Avançado com CodeQL (Análise Semântica de Taint)
  # -------------------------------------------------------------
  sast-codeql:
    name: SAST (CodeQL Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Executar Análise CodeQL
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------------
  # JOB 3: SAST Rápido baseado em Regras com Semgrep
  # -------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep Scan)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Varredura Semgrep
        run: semgrep scan --config auto --sarif --output=semgrep.sarif

      - name: Upload do Relatório SARIF do Semgrep
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # -------------------------------------------------------------
  # JOB 4: Análise de Dependências de Software (SCA) com OSV
  # -------------------------------------------------------------
  sca-osv:
    name: SCA (OSV-Scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=package-lock.json

  # -------------------------------------------------------------
  # JOB 5: Análise de Dependências e Misconfigurations com Trivy
  # -------------------------------------------------------------
  sca-trivy:
    name: SCA & Misconfig (Trivy Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Varredura Trivy (Repository)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload do Relatório SARIF do Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # -------------------------------------------------------------
  # JOB 6: Validação da Política CSP e Integridade Estrutural
  # -------------------------------------------------------------
  csp-and-structure-check:
    name: Validate CSP & File Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Checar se existem dependências externas não autorizadas no HTML
        run: |
          UNAUTHORIZED_LINKS=$(grep -E 'http://|https://' index.html | grep -v 'Content-Security-Policy' | grep -v 'fonts.googleapis.com' | grep -v 'fonts.gstatic.com' || true)
          if [ -n "$UNAUTHORIZED_LINKS" ]; then
            echo "❌ ERRO: Encontrados links/scripts externos não autorizados no index.html:"
            echo "$UNAUTHORIZED_LINKS"
            exit 1
          else
            echo "✅ Validação estática concluída: Somente origens permitidas pela CSP foram identificadas."
          fi

      - name: Validar estrutura de arquivos obrigatórios
        run: |
          test -f index.html || (echo "❌ index.html não encontrado!" && exit 1)
          test -f assets/js/script.js || (echo "❌ assets/js/script.js não encontrado!" && exit 1)
          test -f assets/cs/styles.css || (echo "❌ assets/cs/styles.css não encontrado!" && exit 1)
          test -f README.md || (echo "❌ README.md não encontrado!" && exit 1)
          echo "✅ Todos os arquivos essenciais do projeto estão presentes."

  # -------------------------------------------------------------
  # JOB 7: Publicação e Build de Artefatos
  # -------------------------------------------------------------
  build-artifact:
    name: Bundle & Upload Artifact
    needs:
      [
        lint-and-security,
        sast-codeql,
        sast-semgrep,
        sca-osv,
        sca-trivy,
        csp-and-structure-check,
      ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Empacotar Aplicação
        run: |
          mkdir -p dist/assets
          cp index.html README.md package.json dist/ 2>/dev/null || cp index.html dist/
          cp -r assets/ dist/

      - name: Subir Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: sam-forensic-analyzer-build
          path: dist/
          retention-days: 7

  # -------------------------------------------------------------
  # JOB 8: Análise Dinâmica de Segurança (DAST) com OWASP ZAP
  # -------------------------------------------------------------
  dast-zap:
    name: DAST (OWASP ZAP Baseline Scan)
    needs: [build-artifact]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "https://mdsoare.github.io/sam-ntlm-analyzer/"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true

      - name: Upload do Relatório HTML do DAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-html-report
          path: report_html.html
          retention-days: 14